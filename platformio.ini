; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32-s3-devkitc-1

[env]
framework = arduino
monitor_speed = 115200
lib_ldf_mode = chain+

; ESP32-S3 is the normal local reference target. The additional environments
; are one representative compile target per architecture claimed by library.properties.

[env:uno]
platform = atmelavr@5.1.0
board = uno

[env:nano_every]
platform = atmelmegaavr@1.9.0
board = nano_every

[env:mkrzero]
platform = atmelsam@8.3.0
board = mkrzero

[env:esp32-s3-devkitc-1]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38/platform-espressif32.zip
board = esp32-s3-devkitc-1
upload_speed = 921600
lib_deps = adafruit/Adafruit MCP23017 Arduino Library@^2.3.2

[env:esp8266_nodemcuv2]
platform = espressif8266@4.2.1
board = nodemcuv2
upload_speed = 921600

[env:bluepill_f103c8]
platform = ststm32@19.7.1
board = bluepill_f103c8
upload_protocol = stlink

[env:teensy41]
platform = teensy@5.0.0
board = teensy41

[env:pico]
platform = raspberrypi@1.20.0
board = pico
