name=Universal_Button
version=2.0.0
author=Little Man Builds (Darren Osborne)
maintainer=Little Man Builds <littlemanbuilds@gmail.com>
sentence=Debounced multi-button input with explicit reader validity, preserved interaction events, long-hold state, and latching.
paragraph=Header-only Arduino library for native GPIO, logical pressed-state callbacks, electrical-level callbacks, and validity-aware external readers. Provides per-button debounce/timing, short/double/long interaction classification, LongStarted/LongReleased semantics, a bounded event queue with overflow diagnostics, input freshness and sequence metadata, synchronized reconfiguration/recovery, optional latching, enum-friendly access, and zero dynamic allocation. ESP32-S3 is the primary project target; portable compile gates cover AVR, megaAVR, SAMD, ESP32, ESP8266, RP2040, Teensy and STM32.
category=Signal Input/Output
url=https://github.com/LittleManBuilds/Universal_Button
license=MIT
